<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrontrowMD — Marketing Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --midnight:    #020F18;
    --deep-navy:   #172C45;
    --mid-navy:    #1D4053;
    --soft-teal:   #72A4BF;
    --white:       #FFFFFF;
    --card-bg:     rgba(114,164,191,0.08);
    --card-border: #D4E6EF;
    --teal-10:     rgba(114,164,191,0.10);
    --grad-dark:   linear-gradient(135deg,#020F18 0%,#1D4053 50%,#72A4BF 100%);
    --grad-light:  linear-gradient(135deg,#F5F7FA 0%,#EBF3F8 60%,#D8ECF5 100%);
    --shadow-sm:   0 2px 12px rgba(23,44,69,0.06);
    --shadow-md:   0 4px 16px rgba(2,15,24,0.12);
    --shadow-hov:  0 8px 24px rgba(23,44,69,0.12);
    --warn-bg:     #FFF8E1; --warn-tx: #B8860B;
    --good-bg:     rgba(26,107,58,0.08); --good-tx: #1A6B3A;
    --danger-bg:   rgba(192,57,43,0.07); --danger-tx: #C0392B;
    --up:   #1A6B3A; --up-bg:   rgba(26,107,58,0.10);
    --down: #C0392B; --down-bg: rgba(192,57,43,0.09);
    --flat: #5a7a8a; --flat-bg: rgba(90,122,138,0.09);
    --radius:14px; --pill:50px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--grad-light);color:var(--midnight);font-family:'Libre Baskerville',Georgia,serif;font-size:14px;line-height:1.65;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(114,164,191,0.04) 20px,rgba(114,164,191,0.04) 22px);}
  .wrap{max-width:1360px;margin:0 auto;padding:0 40px 80px;position:relative;z-index:1;}

  /* HEADER */
  header{background:var(--grad-dark);margin:0 -40px 48px;padding:36px 48px 32px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;}
  header::after{content:'';position:absolute;right:0;top:0;bottom:0;width:340px;background:radial-gradient(ellipse at right center,rgba(114,164,191,0.12) 0%,transparent 70%);pointer-events:none;}
  .logo-img{height:40px;width:auto;display:block;}
  .logo-fallback{font-size:18px;font-weight:400;color:rgba(255,255,255,0.85);letter-spacing:0.02em;display:flex;align-items:center;gap:8px;}
  .logo-fallback strong{font-weight:700;color:var(--white);}
  h1{font-size:clamp(22px,2.8vw,34px);font-weight:700;color:var(--white);line-height:1.2;margin-top:14px;}
  h1 em{font-style:normal;color:var(--soft-teal);}
  .header-right{text-align:right;position:relative;z-index:1;flex-shrink:0;}
  .gen-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:4px;}
  .gen-time{font-size:14px;color:rgba(255,255,255,0.85);}
  .ds-pills{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap;}
  .ds-pill{font-size:10px;letter-spacing:0.06em;padding:4px 12px;border-radius:var(--pill);border:1px solid rgba(114,164,191,0.35);color:rgba(255,255,255,0.6);}

  /* TABS */
  .tabs{display:flex;gap:6px;margin-bottom:36px;}
  .tab{font-family:'Libre Baskerville',Georgia,serif;font-size:13px;padding:10px 26px;border-radius:var(--pill);cursor:pointer;border:1.5px solid var(--card-border);background:transparent;color:var(--mid-navy);transition:all 0.2s ease;}
  .tab:hover{border-color:var(--soft-teal);background:var(--teal-10);}
  .tab.active{background:var(--deep-navy);color:var(--white);border-color:var(--deep-navy);font-weight:700;}
  .tab:focus{outline:2px solid var(--soft-teal);outline-offset:2px;}

  /* PANELS */
  .panel{display:none;}
  .panel.active{display:block;animation:fadeUp 0.3s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* SECTION LABEL */
  .sl{font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--soft-teal);margin-bottom:16px;display:flex;align-items:center;gap:14px;}
  .sl::after{content:'';flex:1;height:1px;background:var(--card-border);}

  /* DELTA BADGE */
  .delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--pill);margin-top:6px;}
  .delta-up  {background:var(--up-bg);  color:var(--up);}
  .delta-down{background:var(--down-bg);color:var(--down);}
  .delta-flat{background:var(--flat-bg);color:var(--flat);}
  .delta-sub {font-size:10px;font-weight:400;opacity:0.7;margin-left:2px;}

  /* DARK STAT CARDS */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px;}
  .stat-card{background:linear-gradient(135deg,var(--deep-navy),var(--mid-navy));border-radius:var(--radius);padding:24px 28px;color:var(--white);box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
  .stat-card::after{content:'';position:absolute;right:-10px;bottom:-10px;width:80px;height:80px;border-radius:50%;background:rgba(114,164,191,0.08);}
  .sc-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(114,164,191,0.75);margin-bottom:8px;}
  .sc-value{font-size:36px;font-weight:700;line-height:1;}
  .sc-sub{font-size:12px;color:rgba(255,255,255,0.45);margin-top:6px;font-style:italic;}
  .sc-delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--pill);margin-top:8px;}
  .sc-delta-up  {background:rgba(26,107,58,0.25); color:#7ecda0;}
  .sc-delta-down{background:rgba(192,57,43,0.25); color:#f09090;}
  .sc-delta-flat{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);}

  /* KPI GRID */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:32px;}
  .kpi{background:var(--white);border:1px solid var(--card-border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform 0.2s ease,box-shadow 0.2s ease;}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-hov);}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-stripe,var(--soft-teal));}
  .kpi-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--soft-teal);margin-bottom:10px;}
  .kpi-value{font-size:30px;font-weight:700;color:var(--deep-navy);line-height:1;}
  .kpi-sub{font-size:11px;color:#8a9aaa;margin-top:6px;font-style:italic;}
  .kpi-navy{--kpi-stripe:var(--deep-navy);}
  .kpi-good{--kpi-stripe:#2E7D52;}

  /* WEBSITE FUNNEL (mini inline funnel inside KPI section) */
  .wf-wrap{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:0;margin-bottom:32px;}
  .wf-node{background:var(--white);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform 0.2s ease,box-shadow 0.2s ease;}
  .wf-node:hover{transform:translateY(-2px);box-shadow:var(--shadow-hov);}
  .wf-node::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--soft-teal);}
  .wf-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--soft-teal);margin-bottom:8px;}
  .wf-value{font-size:28px;font-weight:700;color:var(--deep-navy);line-height:1;}
  .wf-rate{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;font-weight:700;color:var(--soft-teal);background:rgba(114,164,191,0.10);border-radius:4px;padding:3px 8px;border:1px solid rgba(114,164,191,0.18);}
  .wf-rate-lbl{font-weight:400;color:#8a9aaa;font-size:10px;margin-left:2px;}
  .wf-arrow{display:flex;align-items:center;justify-content:center;padding:0 6px;}
  .wf-arrow-icon{width:40px;height:40px;color:var(--soft-teal);font-size:28px;display:flex;align-items:center;justify-content:center;font-weight:900;opacity:0.85;}

  /* CHART CARDS */
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:32px;}
  .chart-card{background:var(--white);border:1px solid var(--card-border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-sm);transition:transform 0.2s ease,box-shadow 0.2s ease;}
  .chart-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hov);}
  .chart-title{font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--soft-teal);margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;}
  .chart-title-meta{font-size:11px;letter-spacing:0.04em;color:#8a9aaa;font-weight:400;text-transform:none;}

  /* SPEND SUMMARY STRIP */
  .spend-summary{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--card-border);border-radius:10px;overflow:hidden;}
  .ss-item{flex:1;padding:14px 18px;}
  .ss-item+.ss-item{border-left:1px solid var(--card-border);}
  .ss-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--soft-teal);margin-bottom:4px;}
  .ss-value{font-size:20px;font-weight:700;color:var(--deep-navy);line-height:1;}
  .ss-sub{font-size:10px;color:#8a9aaa;margin-top:4px;font-style:italic;}

  /* BAR CHART */
  .bar-chart{display:flex;flex-direction:column;gap:12px;}
  .bar-row{display:flex;align-items:center;gap:12px;}
  .bar-name{font-size:12px;color:var(--mid-navy);width:110px;flex-shrink:0;text-align:right;}
  .bar-track{flex:1;height:8px;background:var(--card-bg);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;transition:width 0.8s cubic-bezier(0.16,1,0.3,1);}
  .bar-val{font-size:12px;font-weight:700;color:var(--deep-navy);width:74px;flex-shrink:0;}

  /* DONUT */
  .donut-wrap{display:flex;align-items:center;gap:24px;margin-bottom:22px;}
  .donut-legend{display:flex;flex-direction:column;gap:10px;flex:1;}
  .leg-item{display:flex;align-items:center;gap:10px;font-size:12px;}
  .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .leg-name{color:var(--mid-navy);flex:1;}
  .leg-pct{font-weight:700;color:var(--deep-navy);}

  /* CPD TABLE */
  .cpd-table{width:100%;border-collapse:collapse;}
  .cpd-table th{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--soft-teal);text-align:left;padding:0 12px 12px 0;border-bottom:1px solid var(--card-border);}
  .cpd-table th:not(:first-child){text-align:right;padding-left:12px;}
  .cpd-table td{padding:10px 12px 10px 0;border-bottom:1px solid rgba(212,230,239,0.5);font-size:13px;vertical-align:top;color:var(--mid-navy);}
  .cpd-table td:not(:first-child){text-align:right;font-weight:700;color:var(--deep-navy);padding-left:12px;}
  .cpd-table tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:var(--pill);}
  .badge-warn{background:var(--warn-bg);color:var(--warn-tx);}
  .badge-good{background:var(--good-bg);color:var(--good-tx);}
  .badge-na{background:var(--card-bg);color:#8a9aaa;}

  /* DATE FILTER */
  .date-filter{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding:16px 20px;background:rgba(114,164,191,0.06);border:1px solid var(--card-border);border-radius:12px;flex-wrap:wrap;}
  .date-filter label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--soft-teal);}
  .date-filter input[type=date]{font-family:'Libre Baskerville',Georgia,serif;font-size:13px;color:var(--deep-navy);background:#fff;border:1.5px solid var(--card-border);border-radius:8px;padding:7px 12px;outline:none;cursor:pointer;}
  .date-filter input[type=date]:focus{border-color:var(--soft-teal);}
  .date-filter-sep{font-size:12px;color:#8a9aaa;}
  .date-filter-btn{font-family:'Libre Baskerville',Georgia,serif;font-size:13px;font-weight:700;background:var(--deep-navy);color:#fff;border:none;border-radius:50px;padding:9px 22px;cursor:pointer;transition:all 0.2s ease;}
  .date-filter-btn:hover{background:var(--midnight);transform:translateY(-1px);}
  .date-filter-btn.secondary{background:transparent;color:var(--mid-navy);border:1.5px solid var(--card-border);}
  .date-filter-btn.secondary:hover{border-color:var(--soft-teal);background:var(--teal-10);}
  .date-filter-loading{font-size:12px;color:#8a9aaa;font-style:italic;}
  .date-filter-note{font-size:11px;color:#8a9aaa;width:100%;}

  /* FUNNEL — log scale so visitors don't dwarf demos */
  .funnel{display:flex;flex-direction:column;gap:0;}
  .funnel-step{display:grid;grid-template-columns:140px 1fr 110px;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid rgba(212,230,239,0.4);}
  .funnel-step:last-child{border-bottom:none;}
  .funnel-name{font-size:12px;color:var(--mid-navy);text-align:right;line-height:1.4;}
  .funnel-track{background:var(--card-bg);border-radius:6px;height:36px;position:relative;overflow:hidden;}
  .funnel-bar{height:100%;border-radius:6px;transition:width 0.9s cubic-bezier(0.16,1,0.3,1);display:flex;align-items:center;padding-left:12px;box-sizing:border-box;}
  .funnel-bar-label{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,0.15);}
  .funnel-cvr-col{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .funnel-cvr-val{font-size:13px;font-weight:700;color:var(--deep-navy);}
  .funnel-cvr-lbl{font-size:10px;color:#8a9aaa;font-style:italic;}
  .funnel-connector{text-align:center;font-size:20px;font-weight:900;color:var(--soft-teal);padding:1px 0;grid-column:1/-1;opacity:0.8;line-height:1.2;}
  .funnel-scale-note{font-size:10px;color:#8a9aaa;font-style:italic;text-align:right;margin-bottom:8px;}

  /* PAID MEDIA TAB */
  .pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:32px;}
  .pm-card{background:rgba(114,164,191,0.06);border:1px solid var(--card-border);border-radius:12px;padding:20px;transition:all 0.2s ease;}
  .pm-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(23,44,69,0.08);}
  .pm-card-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .pm-card-icon{font-size:20px;}
  .pm-card-name{font-size:14px;font-weight:700;color:var(--deep-navy);}
  .pm-card-spend{font-size:22px;font-weight:700;color:var(--deep-navy);margin-bottom:4px;}
  .pm-card-rows{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--card-border);}
  .pm-card-row{display:flex;justify-content:space-between;align-items:center;}
  .pm-card-row-label{font-size:11px;color:#8a9aaa;text-transform:uppercase;letter-spacing:0.06em;}
  .pm-card-row-val{font-size:13px;font-weight:700;color:var(--deep-navy);}
  .pm-card-row-delta{font-size:11px;margin-left:6px;}
  .pm-summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
  .pm-summary-cell{background:linear-gradient(135deg,#172C45,#1D4053);border-radius:12px;padding:20px;color:#fff;text-align:center;}
  .pm-summary-cell .psc-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--soft-teal);margin-bottom:6px;}
  .pm-summary-cell .psc-val{font-size:24px;font-weight:700;}
  .pm-summary-cell .psc-delta{font-size:11px;margin-top:4px;opacity:0.8;}
  /* Force dark-mode aware delta pills inside dark summary cards */
  .pm-summary-cell .delta     {background:rgba(255,255,255,0.10);color:rgba(255,255,255,0.85);}
  .pm-summary-cell .delta-up  {background:rgba(26,107,58,0.35);  color:#7ecda0;}
  .pm-summary-cell .delta-down{background:rgba(192,57,43,0.35);  color:#f09090;}
  .pm-summary-cell .delta-flat{background:rgba(255,255,255,0.10);color:rgba(255,255,255,0.5);}

  /* PIPELINE */
  .pl-grid{display:flex;flex-direction:column;gap:12px;}
  .pl-row{display:flex;align-items:center;gap:12px;}
  .pl-name{font-size:12px;color:var(--mid-navy);width:150px;flex-shrink:0;}
  .pl-track{flex:1;background:var(--card-bg);border-radius:4px;height:10px;overflow:hidden;}
  .pl-fill{height:100%;border-radius:4px;transition:width 0.8s cubic-bezier(0.16,1,0.3,1);}
  .pl-val{font-size:13px;font-weight:700;color:var(--deep-navy);width:38px;text-align:right;flex-shrink:0;}

  /* SOURCE BREAKDOWN */
  .src-grid{display:flex;flex-direction:column;gap:10px;padding:4px 0;}
  .src-row{display:grid;grid-template-columns:180px 1fr 48px 40px 70px;align-items:center;gap:12px;}
  .src-name{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mid-navy);font-weight:600;}
  .src-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .src-bar-wrap{min-width:0;}
  .src-bar-track{background:var(--card-bg);border-radius:4px;height:10px;overflow:hidden;}
  .src-bar-fill{height:100%;border-radius:4px;transition:width 0.8s cubic-bezier(0.16,1,0.3,1);}
  .src-count{font-size:13px;font-weight:700;color:var(--deep-navy);text-align:right;}
  .src-pct{font-size:11px;color:#8a9aaa;text-align:right;}
  .src-delta{text-align:right;}

  /* INTELLIGENCE SECTION */
  .intel-summary-bar{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .intel-summary-pill{display:flex;align-items:center;gap:7px;padding:7px 16px;border-radius:50px;font-size:12px;font-weight:700;border:1px solid;}
  .intel-summary-pill .isp-count{font-size:18px;font-weight:700;line-height:1;}

  .isp-alert{background:rgba(192,57,43,0.08);border-color:rgba(192,57,43,0.25);color:#b5392a;}
  .isp-weak {background:#FFF8E1;border-color:rgba(184,134,11,0.3);color:#9a7a0a;}
  .isp-opp  {background:rgba(26,138,138,0.07);border-color:rgba(26,138,138,0.25);color:#1a6b6b;}
  .isp-win  {background:rgba(26,107,58,0.07);border-color:rgba(26,107,58,0.25);color:#1A6B3A;}

  .intel-category{margin-bottom:26px;}
  .intel-category:last-child{margin-bottom:0;}
  .intel-cat-label{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:11px;}
  .intel-cat-label::after{content:'';flex:1;height:1px;}
  .intel-cat-alert .intel-cat-label{color:#b5392a;}
  .intel-cat-alert .intel-cat-label::after{background:rgba(192,57,43,0.2);}
  .intel-cat-weak  .intel-cat-label{color:#9a7a0a;}
  .intel-cat-weak  .intel-cat-label::after{background:rgba(184,134,11,0.2);}
  .intel-cat-opp   .intel-cat-label{color:#1a6b6b;}
  .intel-cat-opp   .intel-cat-label::after{background:rgba(26,107,107,0.2);}
  .intel-cat-win   .intel-cat-label{color:#1A6B3A;}
  .intel-cat-win   .intel-cat-label::after{background:rgba(26,107,58,0.2);}

  .intel-cards{display:flex;flex-direction:column;gap:9px;}
  .intel-card{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:15px 20px;border-radius:12px;border-left:3px solid;box-shadow:var(--shadow-sm);transition:transform 0.15s ease,box-shadow 0.15s ease;}
  .intel-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .intel-cat-alert .intel-card{border-color:#b5392a;background:rgba(192,57,43,0.05);}
  .intel-cat-weak  .intel-card{border-color:#B8860B;background:#FFFDF2;}
  .intel-cat-opp   .intel-card{border-color:#1a8a8a;background:rgba(26,138,138,0.05);}
  .intel-cat-win   .intel-card{border-color:#2E7D52;background:rgba(26,107,58,0.05);}
  .intel-icon{font-size:15px;padding-top:1px;}
  .intel-title{font-size:13px;font-weight:700;color:var(--deep-navy);margin-bottom:4px;line-height:1.35;}

function switchTab(key, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + key).classList.add('active');
  btn.classList.add('active');
  // Build paid media panel on first view
  if (key === 'paidmedia' && !document.getElementById('panel-paidmedia').innerHTML.trim()) {
    document.getElementById('panel-paidmedia').innerHTML = buildPaidMediaPanel();
  }
}

// Set default dates for custom picker (yesterday as both from/to)
// and check whether the local API server is reachable
(function initDatePicker() {
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const iso = d => d.toISOString().split('T')[0];
  const dfFrom = document.getElementById('df-from');
  const dfTo   = document.getElementById('df-to');
  if (dfFrom) { dfFrom.value = iso(yest); dfFrom.max = iso(yest); }
  if (dfTo)   { dfTo.value   = iso(yest); dfTo.max   = iso(yest); }

  // Ping the server and update status indicator
  const statusEl = document.getElementById('df-status');
  if (!statusEl) return;
  statusEl.textContent = '⏳ checking server…';
  fetch('http://localhost:3001/health', { signal: AbortSignal.timeout(3000) })
    .then(r => r.json())
    .then(d => {
      statusEl.textContent = '🟢 Server online — ready';
      statusEl.style.color = '#2e7d52';
    })
    .catch(() => {
      statusEl.textContent = '🔴 Server offline — run: node report.js --serve';
      statusEl.style.color = '#c0392b';
    });
})();

async function runCustomRange() {
  const from = document.getElementById('df-from').value;
  const to   = document.getElementById('df-to').value;
  if (!from || !to) { alert('Please select both a start and end date.'); return; }
  if (from > to)    { alert('Start date must be before end date.'); return; }

  const loading = document.getElementById('df-loading');
  const content = document.getElementById('panel-custom-content');
  const btn     = document.querySelector('.date-filter-btn');

  loading.style.display = 'inline';
  btn.disabled = true;
  btn.textContent = 'Loading…';
  content.innerHTML = '';

  const API = `http://localhost:3001/custom?from=${from}&to=${to}`;

  try {
    const res = await fetch(API, { signal: AbortSignal.timeout(120000) });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      throw new Error(err.error || `Server returned ${res.status}`);
    }

    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Unknown server error');

    // Inject the window into the page data so buildPanel can use it
    DATA.windows.__custom = json.window;
    content.innerHTML = buildPanel('__custom', json.window);

    // Animate in
    content.style.opacity = '0';
    content.style.transition = 'opacity 0.3s ease';
    requestAnimationFrame(() => { content.style.opacity = '1'; });

  } catch (err) {
    // Distinguish between connection refused and other errors
    const isOffline = err.message.includes('Failed to fetch') ||
                      err.message.includes('ECONNREFUSED') ||
                      err.message.includes('NetworkError') ||
                      err.message.includes('Load failed');

    const label = from === to ? formatDateShort(from) : `${formatDateShort(from)} – ${formatDateShort(to)}`;

    content.innerHTML = isOffline
      ? `<div style="padding:32px;text-align:center;color:#8a9aaa;font-size:14px;line-height:1.8">
          <div style="font-size:32px;margin-bottom:12px">🔌</div>
          <strong style="color:var(--deep-navy);font-size:16px">API server not running</strong><br><br>
          The custom range server isn't reachable at <code>localhost:3001</code>.<br><br>
          Start it in your terminal:<br>
          <code style="display:inline-block;margin-top:8px;padding:10px 16px;background:rgba(114,164,191,0.1);border-radius:8px;font-size:13px">
            node report.js --serve
          </code><br><br>
          Then click <strong>Load Data</strong> again to fetch <strong>${label}</strong>.
        </div>`
      : `<div style="padding:32px;text-align:center;color:#c0392b;font-size:14px;line-height:1.8">
          <div style="font-size:32px;margin-bottom:12px">⚠️</div>
          <strong>Error fetching data</strong><br><br>
          ${err.message}
        </div>`;
  } finally {
    loading.style.display = 'none';
    btn.disabled = false;
    btn.textContent = 'Load Data';
  }
}

function formatDateShort(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}


// ── Custom Range Preset helpers ────────────────────────────────
function setCustomPreset(days) {
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const from = new Date(yest); from.setDate(from.getDate() - (days - 1));
  const iso = d => d.toISOString().split('T')[0];
  document.getElementById('df-from').value = iso(from);
  document.getElementById('df-to').value   = iso(yest);
}
function setCustomPresetQuarter() {
  const now = new Date();
  const q   = Math.floor(now.getMonth() / 3);
  const from = new Date(now.getFullYear(), q * 3, 1);
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const iso = d => d.toISOString().split('T')[0];
  document.getElementById('df-from').value = iso(from);
  document.getElementById('df-to').value   = iso(yest);
}
function setCustomPresetLastMonth() {
  const now  = new Date();
  const from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const to   = new Date(now.getFullYear(), now.getMonth(), 0);
  const iso = d => d.toISOString().split('T')[0];
  document.getElementById('df-from').value = iso(from);
  document.getElementById('df-to').value   = iso(to);
}

// ── Sparkline SVG (mini 7-point line) ──────────────────────────
function buildSparkline(points, w=140, h=36, color='rgba(255,255,255,0.6)') {
  if (!points || points.length < 2) return '';
  const min = Math.min(...points), max = Math.max(...points);
  const range = max - min || 1;
  const px = (i) => (i / (points.length - 1)) * w;
  const py = (v) => h - ((v - min) / range) * (h * 0.8) - h * 0.1;
  const d = points.map((v,i) => `${i===0?'M':'L'}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" style="position:absolute;bottom:0;left:0;right:0;width:100%;opacity:0.3;pointer-events:none" preserveAspectRatio="none" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="sparkgrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.4"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w},${h} L0,${h} Z" fill="url(#sparkgrad)"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// ── CPD Trend Line Chart SVG ───────────────────────────────────
function buildCPDLineChart(channelData, windowKeys, wLabels) {
  const W = 700, H = 280, PL = 56, PR = 120, PT = 24, PB = 44;
  const cw = W - PL - PR, ch = H - PT - PB;
  const channels = ['meta','tiktok','google','linkedin'];
  const names    = {meta:'Meta',tiktok:'TikTok',google:'Google Ads',linkedin:'LinkedIn'};
  const colors   = {meta:'#4d8aaa',tiktok:'#72A4BF',google:'#9bbfd4',linkedin:'#1D4053'};
  const dashes   = {meta:'none',tiktok:'none',google:'4 3',linkedin:'6 3'};

  // Collect all CPD values for y-axis range
  const allVals = [];
  channels.forEach(k => {
    windowKeys.forEach(w => {
      const c = channelData[w]?.[k];
      if (c && c.demos > 0) allVals.push(c.spend / c.demos);
    });
  });
  if (allVals.length < 2) return '<div style="text-align:center;padding:20px;color:#8a9aaa;font-style:italic;font-size:12px">Not enough data across windows</div>';

  const yMin = 0, yMax = Math.ceil(Math.max(...allVals) * 1.2 / 100) * 100;
  const xPts = windowKeys.length;
  const xStep = cw / (xPts - 1 || 1);
  const yScale = v => PT + ch - ((v - yMin) / (yMax - yMin || 1)) * ch;
  const xPos   = i => PL + i * xStep;

  // Grid lines + y-axis labels
  const yTicks = 5;
  let gridLines = '', yLabels = '';
  for (let i = 0; i <= yTicks; i++) {
    const v = yMin + (yMax - yMin) * (i / yTicks);
    const y = yScale(v);
    gridLines += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="${i===0?'rgba(212,230,239,0.9)':'rgba(212,230,239,0.45)'}" stroke-width="${i===0?1.5:1}"/>`;
    yLabels   += `<text x="${PL-10}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#8a9aaa" font-family="'Libre Baskerville',Georgia,serif">$${Math.round(v)}</text>`;
  }

  // X column bands (alternating subtle highlight)
  let bands = '';
  windowKeys.forEach((w,i) => {
    const bw = cw / xPts;
    const bx = PL + i * bw;
    bands += `<rect x="${bx.toFixed(1)}" y="${PT}" width="${bw.toFixed(1)}" height="${ch}" fill="${i%2===0?'rgba(245,247,250,0.0)':'rgba(114,164,191,0.04)'}"/>`;
  });

  // X column labels + top dividers
  let xLabels = '', xDividers = '';
  windowKeys.forEach((w,i) => {
    const x = xPos(i);
    xLabels += `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="12" fill="#8a9aaa" font-family="'Libre Baskerville',Georgia,serif">${wLabels[w]}</text>`;
    if (i > 0) xDividers += `<line x1="${x.toFixed(1)}" y1="${PT}" x2="${x.toFixed(1)}" y2="${PT+ch}" stroke="rgba(212,230,239,0.5)" stroke-width="1" stroke-dasharray="4 3"/>`;
  });

  // Build channel point data
  const channelPts = {};
  channels.forEach(k => {
    channelPts[k] = windowKeys.map((w,i) => {
      const c = channelData[w]?.[k];
      if (!c || c.demos === 0) return null;
      return { x: xPos(i), y: yScale(c.spend / c.demos), v: c.spend / c.demos, wi: i };
    });
  });

  // Lines
  let lines = '';
  channels.forEach(k => {
    const pts = channelPts[k];
    let pathD = '', inPath = false;
    pts.forEach(pt => {
      if (!pt) { inPath = false; return; }
      pathD += inPath ? ` L${pt.x.toFixed(1)},${pt.y.toFixed(1)}` : `M${pt.x.toFixed(1)},${pt.y.toFixed(1)}`;
      inPath = true;
    });
    if (!pathD) return;
    lines += `<path d="${pathD}" fill="none" stroke="${colors[k]}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${dashes[k]}" opacity="0.9"/>`;
  });

  // Dots + end-of-line labels on the right (no collision with data points)
  let dots = '', endLabels = '';
  channels.forEach(k => {
    const pts = channelPts[k];
    const valid = pts.filter(Boolean);
    if (!valid.length) return;

    valid.forEach((pt, i) => {
      dots += `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="5" fill="${colors[k]}" stroke="white" stroke-width="2"/>`;
      // Only label first and last point (not middle — too cramped)
      if (i === 0 || i === valid.length - 1) {
        const anchor = i === 0 ? 'end' : 'start';
        const xOff   = i === 0 ? -10 : 10;
        dots += `<text x="${(pt.x + xOff).toFixed(1)}" y="${(pt.y + 4).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="bold" fill="${colors[k]}" font-family="'Libre Baskerville',Georgia,serif">$${Math.round(pt.v)}</text>`;
      }
    });

    // Right-side channel label (after last data point)
    const lastPt = valid[valid.length - 1];
    endLabels += `<text x="${(W-PR+12).toFixed(1)}" y="${(lastPt.y+4).toFixed(1)}" text-anchor="start" font-size="11" font-weight="bold" fill="${colors[k]}" font-family="'Libre Baskerville',Georgia,serif">${names[k]}</text>`;
  });

  return `
    <div style="overflow-x:auto;margin-top:4px">
      <svg width="100%" viewBox="0 0 ${W} ${H}" style="min-width:360px;font-family:'Libre Baskerville',Georgia,serif">
        ${bands}${gridLines}${xDividers}${yLabels}${xLabels}${lines}${dots}${endLabels}
      </svg>
    </div>`;
}

// ── Delta helpers ──────────────────────────────────────────────
function deltaNum(curr, prev) {
  if (!prev || prev === 0) return null;
  return (curr - prev) / Math.abs(prev);
}
function deltaBadge(curr, prev, { invert=false, isPercent=false }={}) {
  const d = deltaNum(curr, prev);
  if (d === null) return '';
  const pct = (d * 100).toFixed(1);
  const isUp   = d > 0.005;
  const isDown = d < -0.005;
  let cls, arrow;
  if (isUp)        { cls = invert ? 'delta-down' : 'delta-up';   arrow = '▲'; }
  else if (isDown) { cls = invert ? 'delta-up'   : 'delta-down'; arrow = '▼'; }
  else             { cls = 'delta-flat'; arrow = '—'; }
  const sign = d >= 0 ? '+' : '';
  return `<span class="delta ${cls}">${arrow} ${sign}${pct}%</span>`;
}
function scDelta(curr, prev, { invert=false }={}) {
  const d = deltaNum(curr, prev);
  if (d === null) return '';
  const pct = (d * 100).toFixed(1);
  const isUp   = d > 0.005;
  const isDown = d < -0.005;
  let cls, arrow;
  if (isUp)        { cls = invert ? 'sc-delta-down' : 'sc-delta-up';   arrow = '▲'; }
  else if (isDown) { cls = invert ? 'sc-delta-up'   : 'sc-delta-down'; arrow = '▼'; }
  else             { cls = 'sc-delta-flat'; arrow = '—'; }
  const sign = d >= 0 ? '+' : '';
  return `<span class="sc-delta ${cls}">${arrow} ${sign}${pct}%</span>`;
}
function parsePct(str) {
  if (!str || str === 'N/A') return null;
  return parseFloat(str) / 100;
}

// ── Donut SVG ──────────────────────────────────────────────────
function buildDonut(slices, size=130, stroke=22) {
  const r=(size-stroke)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const total=slices.reduce((s,sl)=>s+sl.value,0);
  let offset=0, paths='';
  slices.forEach(sl=>{
    if(!sl.value) return;
    const dash=(sl.value/total)*circ, gap=circ-dash;
    paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${sl.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=dash;
  });
  return `<svg width="${size}" height="${size}" style="flex-shrink:0">${paths}</svg>`;
}

// ── Intelligence Engine ─────────────────────────────────────────
function buildIntelligence(d, p) {
  const ch=d.channels, ga=d.ga4, pp=d.pipeline;
  const pch=p.channels, pga=p.ga4, ppp=p.pipeline;
  const F={alerts:[],weaknesses:[],opportunities:[],wins:[]};

  const pct=(a,b)=>b>0?(a/b)*100:null;
  const chg=(c,v)=>v>0?((c-v)/v)*100:null;
  const fD=n=>'$'+Number(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const fP=(n,d=1)=>n!==null?n.toFixed(d)+'%':'N/A';
  const ar=n=>n>0?'↑':'↓';
  const ab=n=>Math.abs(n).toFixed(1);

  // ── Data quality (always surface) ───────────────────────────
  ['meta','google','tiktok','linkedin'].forEach(k=>{
    if(ch[k].spend===0) F.alerts.push({
      title:`${CH_LABELS[k]} — $0 spend recorded`,
      desc:'No spend data received from Windsor.ai.',
      action:'Verify campaign status and Windsor.ai connector sync.'
    });
  });
  ['meta','google','tiktok'].forEach(k=>{
    if(ch[k].spend>200&&ch[k].demos===0) F.alerts.push({
      title:`${CH_LABELS[k]} — spend recorded, 0 demos`,
      desc:`${fD(ch[k].spend)} spent with no attributed demos.`,
      action:'Conversion tracking may be misconfigured in Windsor.ai. Check field mapping.'
    });
  });

  // ── 1. CPD per channel ───────────────────────────────────────
  const chArr=[
    {name:'Meta',k:'meta'},{name:'TikTok',k:'tiktok'},
    {name:'Google Ads',k:'google'},{name:'LinkedIn',k:'linkedin'}
  ].map(c=>({...c,
    spend:ch[c.k].spend,demos:ch[c.k].demos,
    pSpend:pch[c.k].spend,pDemos:pch[c.k].demos,
    cpd:ch[c.k].demos>0?ch[c.k].spend/ch[c.k].demos:null,
    pCpd:pch[c.k].demos>0?pch[c.k].spend/pch[c.k].demos:null,
  }));

  // Best vs worst CPD gap (direct-response only)
  const drArr=chArr.filter(c=>c.name!=='LinkedIn'&&c.cpd!==null);
  if(drArr.length>=2){
    const best=drArr.reduce((a,b)=>a.cpd<b.cpd?a:b);
    const worst=drArr.reduce((a,b)=>a.cpd>b.cpd?a:b);
    const gap=((worst.cpd-best.cpd)/best.cpd)*100;
    if(gap>40){
      const addDemos=Math.round(worst.spend*0.2/best.cpd);
      F.opportunities.push({
        title:`CPD Efficiency Gap — ${best.name} is ${gap.toFixed(0)}% cheaper than ${worst.name}`,
        desc:`${best.name} ${fD(best.cpd)}/demo vs ${worst.name} ${fD(worst.cpd)}/demo.`,
        action:`Shifting 20% of ${worst.name} budget (${fD(worst.spend*0.2)}) to ${best.name} could yield ~${addDemos} additional demos.`
      });
    }
  }

  // CPD trend + absolute thresholds per channel
  chArr.filter(c=>c.name!=='LinkedIn').forEach(c=>{
    if(c.cpd===null) return;
    if(c.cpd>500) F.alerts.push({
      title:`High CPD — ${c.name} at ${fD(c.cpd)}/demo`,
      desc:'Above $500 direct-response threshold.',
      action:'Review targeting and creative mix immediately.'
    });
    if(c.pCpd!==null){
      const d2=chg(c.cpd,c.pCpd);
      if(d2>25) F.weaknesses.push({
        title:`CPD Spike — ${c.name}: ${fD(c.pCpd)} → ${fD(c.cpd)}/demo`,
        desc:`${ar(d2)}${ab(d2)}% increase vs prior period.`,
        action:'Investigate creative fatigue, audience saturation, or bid drift.'
      });
      else if(d2<-20) F.wins.push({
        title:`CPD Improving — ${c.name}: ${fD(c.pCpd)} → ${fD(c.cpd)}/demo`,
        desc:`${ar(d2)}${ab(d2)}% more efficient vs prior period.`,action:''
      });
    }
  });

  // LinkedIn CPD
  const li=chArr.find(c=>c.name==='LinkedIn');
  if(li&&li.cpd!==null){
    if(li.cpd>600) F.alerts.push({
      title:`LinkedIn CPD Critical — ${fD(li.cpd)}/demo`,
      desc:`Spending ${fD(li.spend)} for ${Math.round(li.demos)} demos.`,
      action:'Audit audience targeting, bid strategy, creative format. Test document ads and thought-leadership content.'
    });
    else if(li.cpd>400) F.weaknesses.push({
      title:`LinkedIn CPD High — ${fD(li.cpd)}/demo`,
      desc:'B2B SaaS benchmark is $200–350/demo.',
      action:'Layer targeting: job title + company size + seniority. Exclude companies <10 employees.'
    });
    if(li.pCpd!==null){
      const d2=chg(li.cpd,li.pCpd);
      if(d2>20) F.weaknesses.push({
        title:`LinkedIn Efficiency Declining — ${ar(d2)}${ab(d2)}% (${fD(li.pCpd)} → ${fD(li.cpd)})`,
        desc:'Cost per demo rising month over month.',
        action:'Check audience overlap across campaigns. Review creative frequency cap. Rotate audience lists.'
      });
    }
  }

  // ── 2. Spend concentration ───────────────────────────────────
  const totalSpend=chArr.reduce((s,c)=>s+c.spend,0);
  chArr.forEach(c=>{
    const s=pct(c.spend,totalSpend);
    if(s!==null&&s>55) F.weaknesses.push({
      title:`Channel Concentration — ${c.name} is ${fP(s)} of budget`,
      desc:`${fD(c.spend)} of ${fD(totalSpend)} total spend on one channel.`,
      action:'Single-channel dependency. A policy change or CPM spike would collapse pipeline. Diversify spend.'
    });
  });

  // ── 3. Funnel leakage ────────────────────────────────────────
  const clickRate=pct(ga.demoButtonClicks,ga.users);
  const bookRate=pct(ga.meetingBooked,ga.demoButtonClicks);
  const cvr=pct(ga.meetingBooked,ga.users);
  const pCvr=pct(pga.meetingBooked,pga.users);

  if(clickRate!==null){
    if(clickRate<3) F.weaknesses.push({
      title:`Low Visitor-to-CTA Rate — ${fP(clickRate)} of visitors click the demo button`,
      desc:`Only ${Math.round(ga.demoButtonClicks).toLocaleString()} clicks from ${Math.round(ga.users).toLocaleString()} visitors.`,
      action:'Test above-the-fold headline clarity, CTA button placement, and page load speed. Target: 5%+.'
    });
    else if(clickRate>6) F.wins.push({
      title:`Strong CTA Click Rate — ${fP(clickRate)} visitor-to-CTA`,

    });

    if(bookRate<5) F.alerts.push({
      title:`Critical Booking Drop-Off — only ${fP(bookRate)} of CTA clicks book`,
      desc:`Losing ~${Math.round(ga.demoButtonClicks*(1-bookRate/100))} potential bookings at the scheduling step.`,
      action:'Test: embed Calendly inline vs redirect, reduce required fields, show next available slot immediately.'
    });

      title:`Booking Friction — ${fP(bookRate)} click-to-book`,

      title:`High Booking Conversion — ${fP(bookRate)} of CTA clicks book`,
      desc:'Scheduling experience is working well. Protect this step.',action:''
    });

  if(cvr!==null&&pCvr!==null){
    const d2=chg(cvr,pCvr);
    if(d2<-15) F.alerts.push({
      title:`Website CVR Declining — ${fP(pCvr,2)} → ${fP(cvr,2)}`,
      desc:`${ar(d2)}${ab(d2)}% vs prior period.`,
      action:'Could be: traffic quality drop, landing page regression, or scheduling tool issue. Segment by source to isolate.'
    });
    else if(d2>15) F.wins.push({
      title:`CVR Improving — ${fP(pCvr,2)} → ${fP(cvr,2)}`,
      desc:`${ar(d2)}${ab(d2)}% vs prior period. Landing page or traffic quality improving.`,action:''
    });

  // ── 4. Pipeline health ───────────────────────────────────────

  const showRate=pct(demosHappened,demosToOccur);

    if(showRate<60) F.alerts.push({
      title:`Critical Show Rate — only ${fP(showRate)} of booked demos happen`,

      action:'Add: 24hr + 1hr SMS reminder, confirmation email with prep materials, AE personal outreach day-of.'

      title:`Show Rate Below Target — ${fP(showRate)} (target: 80%+)`,

      title:`Solid Show Rate — ${fP(showRate)} of booked demos happen`,

      desc:`${dealsWon}/${demosHappened} demos closing. Sales team converting well.`,action:''
    });
    if(pCloseRate!==null){
      const d2=chg(closeRate,pCloseRate);
      if(d2<-20) F.weaknesses.push({
        title:`Close Rate Declining — ${fP(pCloseRate)} → ${fP(closeRate)}`,
        desc:`${ar(d2)}${ab(d2)}% vs prior period.`,
        action:'Check: pricing pushback, proposal quality, follow-up speed post-demo.'
      });
      else if(d2>20) F.wins.push({
        title:`Close Rate Improving — ${fP(pCloseRate)} → ${fP(closeRate)}`,
        desc:`${ar(d2)}${ab(d2)}% vs prior period. Sales execution improving.`,action:''
      });
    }
  }

  // ── 5. Revenue velocity ──────────────────────────────────────
  const mrrPD=demosHappened>0?d.newMRR/demosHappened:null;
  const pMrrPD=pDH>0?p.newMRR/pDH:null;
  if(mrrPD!==null&&pMrrPD!==null){
    const d2=chg(mrrPD,pMrrPD);
    if(d2<-20) F.weaknesses.push({
      title:`Deal Size Shrinking — MRR/demo ${fD(pMrrPD)} → ${fD(mrrPD)}`,
      desc:`${ar(d2)}${ab(d2)}% decline in average deal value.`,
      action:'Targeting changes may be pulling in smaller companies. Review new traffic sources and audience composition.'
    });
    else if(d2>20) F.wins.push({
      title:`Deal Size Growing — MRR/demo ${fD(pMrrPD)} → ${fD(mrrPD)}`,
      desc:`${ar(d2)}${ab(d2)}% larger deals closing. Larger accounts in pipeline.`,action:''
    });
  }
  if(d.newMRR>0&&p.newMRR>0){
    const d2=chg(d.newMRR,p.newMRR);
    if(d2>20) F.wins.push({
      title:`Strong MRR Growth — ${fD(d.newMRR)} vs ${fD(p.newMRR)} prior`,
      desc:`${ar(d2)}${ab(d2)}% revenue growth period over period.`,action:''
    });
    else if(d2<-15) F.alerts.push({
      title:`MRR Declining — ${fD(d.newMRR)} vs ${fD(p.newMRR)} prior period`,
      desc:`${ar(d2)}${ab(d2)}% revenue drop.`,
      action:'Diagnose: is pipeline volume, close rate, or deal size declining? Each has a different fix.'
    });
  }

  // ── 6. Meta creative health ──────────────────────────────────
  if(ch.meta.ctrAvg!=null){
    const ctr=ch.meta.ctrAvg;
    const pCtr=pch.meta.ctrAvg;
    if(ctr<0.008) F.weaknesses.push({
      title:`Meta CTR Low — ${(ctr*100).toFixed(2)}%`,
      desc:'Below 0.8% average CTR signals creative fatigue or audience mismatch.',
      action:'Refresh top 3 highest-spend creatives. Test UGC-style vs polished. Try new hook angles: pain-point vs aspirational outcome.'
    });
    else if(ctr>0.018) F.wins.push({
      title:`Strong Meta CTR — ${(ctr*100).toFixed(2)}%`,
      desc:'Creative is resonating. Scale top performers before fatigue sets in.',action:''
    });
    if(pCtr!=null){
      const d2=chg(ctr,pCtr);
      if(d2<-20) F.weaknesses.push({
        title:`Meta CTR Declining — ${(pCtr*100).toFixed(2)}% → ${(ctr*100).toFixed(2)}%`,
        desc:`${ar(d2)}${ab(d2)}% drop. Audience has seen your ads too many times.`,
        action:'Rotate creative immediately. TikTok-native style content is converting for wellness brands right now.'
      });
    }
  }

  // ── 7. Pipeline volume trend ─────────────────────────────────
  if(demosToOccur>0&&pDTO>0){
    const d2=chg(demosToOccur,pDTO);
    if(d2>20) F.wins.push({
      title:`Pipeline Growing — ${demosToOccur} demos vs ${pDTO} prior`,
      desc:`${ar(d2)}${ab(d2)}% growth. Demand is accelerating.`,action:''
    });
    else if(d2<-15) F.alerts.push({
      title:`Pipeline Contracting — ${demosToOccur} demos vs ${pDTO} prior`,
      desc:`${ar(d2)}${ab(d2)}% drop in pipeline volume.`,
      action:'Check CPD trend and budget allocation. If spend held steady, efficiency dropped. If spend dropped, budget was cut.'
    });
  }

  // ── 8. YouTube untracked spend ───────────────────────────────
  const ytShare=pct(ch.youtube.spend,totalSpend);
  if(ytShare!==null&&ytShare>8&&ch.youtube.demos===0) F.weaknesses.push({
    title:`YouTube: Untracked ROI — ${fD(ch.youtube.spend)} (${ytShare.toFixed(0)}% of budget)`,
    desc:'0 demos attributed to YouTube in Windsor.ai.',
    action:'YouTube is brand-awareness only here. If brand lift isn\'t being measured, consider reallocating to direct-response channels.'
  });

  // ── 9. Overall CPD trend ─────────────────────────────────────
  const drS=ch.meta.spend+ch.tiktok.spend+ch.google.spend;
  const drD=ch.meta.demos+ch.tiktok.demos+ch.google.demos;
  const pDrS=pch.meta.spend+pch.tiktok.spend+pch.google.spend;
  const pDrD=pch.meta.demos+pch.tiktok.demos+pch.google.demos;
  const oCPD=drD>0?drS/drD:null, pOCPD=pDrD>0?pDrS/pDrD:null;
  if(oCPD!==null&&pOCPD!==null){
    const d2=chg(oCPD,pOCPD);
    if(d2>20) F.weaknesses.push({
      title:`Overall CPD Rising — ${fD(pOCPD)} → ${fD(oCPD)}/demo`,
      desc:`${ar(d2)}${ab(d2)}% worse vs prior period. Across-the-board efficiency loss.`,
      action:'Likely causes: creative fatigue, seasonal CPM increase, or audience exhaustion. Check top-spend ad frequency.'
    });
    else if(d2<-15) F.wins.push({
      title:`Overall CPD Improving — ${fD(pOCPD)} → ${fD(oCPD)}/demo`,
      desc:`${ar(d2)}${ab(d2)}% better vs prior period. Media efficiency gaining across all channels.`,action:''
    });
  }

  return F;
}

// ── Render Intelligence HTML ────────────────────────────────────
function renderIntelligence(F, prevLabel) {
  const CATS=[
    {key:'alerts',       label:'🚨  Alerts — Requires Immediate Attention', cls:'intel-cat-alert', icon:'🚨', pillCls:'isp-alert', pillLabel:'Alerts'},
    {key:'weaknesses',   label:'⚠️  Weaknesses — Underperformance to Address', cls:'intel-cat-weak', icon:'⚠️', pillCls:'isp-weak', pillLabel:'Weaknesses'},
    {key:'opportunities',label:'🎯  Opportunities — Actionable Upside',        cls:'intel-cat-opp',  icon:'🎯', pillCls:'isp-opp',  pillLabel:'Opportunities'},
    {key:'wins',         label:'✅  Wins — What\'s Working',                   cls:'intel-cat-win',  icon:'✅', pillCls:'isp-win',  pillLabel:'Wins'},
  ];
  const total=CATS.reduce((s,c)=>s+F[c.key].length,0);
  if(total===0) return '<div class="intel-empty">No significant signals detected. All metrics within normal ranges.</div>';

  const pillsHTML=CATS.filter(c=>F[c.key].length>0).map(c=>`
    <div class="intel-summary-pill ${c.pillCls}">
      <span class="isp-count">${F[c.key].length}</span>
      <span>${c.icon} ${c.pillLabel}</span>
    </div>`).join('');

  const catsHTML=CATS.filter(c=>F[c.key].length>0).map(cat=>`
    <div class="intel-category ${cat.cls}">
      <div class="intel-cat-label">${cat.label}</div>
      <div class="intel-cards">
        ${F[cat.key].map(f=>`
          <div class="intel-card">
            <div class="intel-icon">${cat.icon}</div>
            <div>
              <div class="intel-title">${f.title}</div>
              ${f.desc?`<div class="intel-desc">${f.desc}</div>`:''}
              ${f.action?`<div class="intel-action">→ ${f.action}</div>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');

  return `<div class="intel-summary-bar">${pillsHTML}</div>${catsHTML}`;
}

// ── Build panel ────────────────────────────────────────────────
function buildPanel(key, d) {
  const ch=d.channels, ga=d.ga4, pp=d.pipeline;
  const p=d.prev, pch=p.channels, pga=p.ga4, ppp=p.pipeline;
  const prevLabel=d.prevLabel||'prior period';

  // Direct-response spend/demos (excl LI + YT)
  const drSpend=ch.meta.spend+ch.google.spend+ch.tiktok.spend;
  const drDemos=ch.meta.demos+ch.google.demos+ch.tiktok.demos;
  const pdrSpend=pch.meta.spend+pch.google.spend+pch.tiktok.spend;
  const pdrDemos=pch.meta.demos+pch.google.demos+pch.tiktok.demos;

  // Intelligence
  const intelHTML=renderIntelligence(buildIntelligence(d,p), prevLabel);

  // Dark stat cards with sparklines + pacing bar on spend card
  // Build simple 3-window sparkline points: yesterday → rolling7 → mtd (per-day spend)
  const sparkWins = ['yesterday','rolling7','mtd'];
  const spendPts  = sparkWins.map(w => {
    const sw = DATA.windows[w];
    if (!sw) return 0;
    const days = w === 'yesterday' ? 1 : w === 'rolling7' ? 7 : (new Date().getDate() - 1 || 1);
    const s = (sw.channels?.meta?.spend||0)+(sw.channels?.google?.spend||0)+(sw.channels?.tiktok?.spend||0);
    return s / days;
  });
  const mrrPts   = sparkWins.map(w => DATA.windows[w]?.newMRR || 0);
  const cpdPts   = sparkWins.map(w => {
    const sw = DATA.windows[w];
    if (!sw) return 0;
    const s = (sw.channels?.meta?.spend||0)+(sw.channels?.google?.spend||0)+(sw.channels?.tiktok?.spend||0);
    const demos = (sw.channels?.meta?.demos||0)+(sw.channels?.google?.demos||0)+(sw.channels?.tiktok?.demos||0);
    return demos > 0 ? s / demos : 0;
  });

  // Pacing: days through month
  const today = new Date();
  const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const dayOfMonth  = today.getDate() - 1; // completed days (yesterday)
  const pacingPct   = (dayOfMonth / daysInMonth) * 100;
  const totalBudget = Object.values(MONTHLY_BUDGETS).reduce((s,v)=>s+v,0);
  const drBudget    = MONTHLY_BUDGETS.meta + MONTHLY_BUDGETS.google + MONTHLY_BUDGETS.tiktok;
  const totalMTDSpend = Object.keys(MONTHLY_BUDGETS).reduce((s,k) => s + (ch[k]?.spend||0), 0);

  const statHTML=`
    <div class="stat-row">
      <div class="stat-card" style="position:relative;overflow:hidden">
        <div class="sc-label">Total Ad Spend</div>
        <div class="sc-value">${fmt$(drSpend)}</div>
        <div class="sc-sub">Excl. LinkedIn + YouTube</div>
        ${scDelta(drSpend, pdrSpend, {invert:true})}
        ${buildPacingBar(drSpend, drBudget, pacingPct)}
        ${buildSparkline(spendPts)}
      </div>
      <div class="stat-card" style="position:relative;overflow:hidden">
        <div class="sc-label">New MRR</div>
        <div class="sc-value">${fmt$(d.newMRR)}</div>
        <div class="sc-sub">Closed won this period</div>
        ${scDelta(d.newMRR, p.newMRR)}
        ${buildSparkline(mrrPts)}
      </div>
      <div class="stat-card" style="position:relative;overflow:hidden">
        <div class="sc-label">Blended CPD</div>
        <div class="sc-value">${cpd$(drSpend,drDemos)}</div>
        <div class="sc-sub">Excl. LinkedIn + YouTube</div>
        ${scDelta(cpdNum(drSpend,drDemos)||0, cpdNum(pdrSpend,pdrDemos)||0, {invert:true})}
        ${buildSparkline(cpdPts)}
      </div>
    </div>`;

  // ── Website Funnel (3 nodes + arrows) ──────────────────────────────────────
  const wfVisitors   = Math.round(ga.users);
  const wfClicks     = Math.round(ga.demoButtonClicks);
  const wfBooked     = d.demosBooked;
  const pwfVisitors  = Math.round(pga.users);
  const pwfClicks    = Math.round(pga.demoButtonClicks);
  const pwfBooked    = p.demosBooked;

  const wfClickRate  = wfVisitors  > 0 ? (wfClicks  / wfVisitors  * 100).toFixed(2) + '%' : 'N/A';
  const wfBookRate   = wfClicks    > 0 ? (wfBooked  / wfClicks    * 100).toFixed(2) + '%' : 'N/A';
  const wfCVR        = wfVisitors  > 0 ? (wfBooked  / wfVisitors  * 100).toFixed(2) + '%' : 'N/A';

  const wfArrow = `<div class="wf-arrow"><div class="wf-arrow-icon">➜</div></div>`;
  const wfFunnelHTML = `
    <div class="wf-wrap">
      <div class="wf-node">
        <div class="wf-label">Website Visitors</div>
        <div class="wf-value">${fmtN(wfVisitors)}</div>
        <div><span class="wf-rate">${wfClickRate}<span class="wf-rate-lbl">click demo btn</span></span></div>

      </div>
      ${wfArrow}
      <div class="wf-node">
        <div class="wf-label">Demo Button Clicks</div>
        <div class="wf-value">${fmtN(wfClicks)}</div>

      </div>
      ${wfArrow}
      <div class="wf-node">
        <div class="wf-label">Demos Booked</div>

        <div><span class="wf-rate">${wfCVR}<span class="wf-rate-lbl">website CVR</span></span></div>
        ${deltaBadge(wfBooked, pwfBooked)}

  // Show Rate — compute and style

  const pShowRateVal= ppp.demosToOccur > 0 ? (ppp.demosHappened / ppp.demosToOccur * 100) : null;

  const showRateHTML = showRateVal !== null ? `

      <div style="flex:1;min-width:0">

        <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">

      <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        ${pShowRateVal ? deltaBadge(showRateVal, pShowRateVal) : ''}
        <div>

      </div>

  // KPIs with delta badges
  const kpis=[

  // Spend donut + bars — excl LI+YT for totals

  const drKeys=['meta','google','tiktok'];
  const spendSlices=chKeys.map(k=>({label:CH_LABELS[k],value:ch[k].spend,color:CH_COLORS[k]})).filter(s=>s.value>0);

      <div class="ss-item">

      : '<span style="color:#c0c8d0;font-size:10px">—</span>';
    return `<tr>
      <td>${CH_ICONS[c.key]} ${CH_LABELS[c.key]}</td>
      <td>${fmt$(c.spend)}</td>
      <td>${fmtN(c.demos)}</td>
      <td style="text-align:center">${pctBooked}</td>
      <td>${badge}</td>
      <td style="white-space:nowrap">${db}</td>
    </tr>`;
  }).join('');

  // Funnel — each step uses its own correct HubSpot date field
  const fSteps=[
    {name:'Website Visitors',  val:Math.round(ga.users),             prev:Math.round(pga.users),              color:'#9bbfd4'},
    {name:'Clicked Demo',      val:Math.round(ga.demoButtonClicks),  prev:Math.round(pga.demoButtonClicks),   color:'#72A4BF'},
    {name:'Demos Booked',      val:d.demosBooked,                    prev:p.demosBooked,                      color:'#4d8aaa'},
    {name:'Demos to Occur',    val:pp.demosToOccur,                  prev:ppp.demosToOccur,                   color:'#2d6a8a'},
    {name:'Demo Happened',     val:pp.demosHappened,                 prev:ppp.demosHappened,                  color:'#1D4053'},
    {name:'Closed Won',        val:pp.dealsWon,                      prev:ppp.dealsWon,                       color:'#172C45'},
  ];
    // Log scale so Website Visitors (10k+) doesn't flatten Demos (5-30) to nothing
  const logScale = v => Math.log10(Math.max(v, 1) + 1);
  const maxLog   = Math.max(...fSteps.map(s => logScale(s.val)), 1);
  const logPct   = v => Math.max((logScale(v) / maxLog) * 100, 8);

  const funnelHTML = '<div class="funnel-scale-note">Bar width uses log scale — labels show exact values</div>'
    + fSteps.map((s,i) => {
    const pct = logPct(s.val);
    const db  = deltaBadge(s.val, s.prev);
    // Conversion rate TO this step from previous
    const stepCVR = i > 0 && fSteps[i-1].val > 0
      ? (s.val / fSteps[i-1].val * 100).toFixed(1) + '%'
      : null;
    const connectorHTML = i < fSteps.length - 1 ? `
      <div class="funnel-connector" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:3px 0">
        <span style="color:rgba(114,164,191,0.4);font-size:14px">▼</span>
        ${fSteps[i+1] && fSteps[i].val > 0 ? `<span style="font-size:11px;font-weight:700;color:var(--soft-teal);background:rgba(114,164,191,0.10);border-radius:50px;padding:2px 10px;border:1px solid rgba(114,164,191,0.2)">${(fSteps[i+1].val/fSteps[i].val*100).toFixed(1)}% →</span>` : ''}
      </div>` : '';
    return `
      <div class="funnel-step">
        <div class="funnel-name">${s.name}</div>
        <div style="flex:1">
          <div class="funnel-track">
            <div class="funnel-bar" style="width:${pct.toFixed(1)}%;background:${s.color}">
              <span class="funnel-bar-label">${fmtN(s.val)}</span>
            </div>
          </div>
        </div>
        <div class="funnel-cvr-col">
          ${i===0
            ? '<span class="funnel-cvr-val">\u2014</span>'
            : `<span class="funnel-cvr-val">${fmtP(s.val,fSteps[i-1].val)}</span><span class="funnel-cvr-lbl">from prev.</span>`
          }
          ${db}
        </div>
      </div>
      ${connectorHTML}`;
  }).join('');

  // Pipeline
  const plRows=[
    {name:'Demos Booked',         val:d.demosBooked,             prev:p.demosBooked,             color:'#72A4BF', note:'Meeting Booked list, by createdate'},
    {name:'Demos to Occur',       val:pp.demosToOccur,           prev:ppp.demosToOccur,          color:'#4d8aaa', note:'deals by date_demo_booked'},
    {name:'Demo Happened',        val:pp.demosHappened,          prev:ppp.demosHappened,         color:'#1D4053', note:'deals by date_demo_booked'},
    {name:'Closed Won',           val:pp.dealsWon,               prev:ppp.dealsWon,              color:'#172C45', note:'deals by date_demo_booked, closedwon'},
    {name:'Disq. Before Demo',    val:pp.disqualifiedBeforeDemo, prev:ppp.disqualifiedBeforeDemo,color:'#B8860B', invert:true},
    {name:'Not Qual. After Demo', val:pp.notQualAfterDemo,       prev:ppp.notQualAfterDemo,      color:'#c8a04a', invert:true},
    {name:'Too Early',            val:pp.tooEarly,               prev:ppp.tooEarly,              color:'#aab8c2', invert:true},
  ];
  const maxPL2=Math.max(d.demosBooked,1);
  const plHTML=plRows.map(r=>`
    <div class="pl-row">
      <div class="pl-name">${r.name}${r.note?`<span style="display:block;font-size:9px;color:#8a9aaa;font-style:italic">${r.note}</span>`:''}</div>
      <div class="pl-track"><div class="pl-fill" style="width:${Math.min((r.val/maxPL2)*100,100).toFixed(1)}%;background:${r.color}"></div></div>
      <div class="pl-val">${fmtN(r.val)}</div>
      ${deltaBadge(r.val, r.prev, {invert: !!r.invert})}
    </div>`).join('');

  // Disqualification breakdown (if data available)
  const dqTotal = pp.disqualifiedBeforeDemo + pp.notQualAfterDemo;
  const dqHTML = dqTotal > 0 ? `
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--card-border)">
      <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--soft-teal);margin-bottom:10px">Disqualification Breakdown</div>
      ${[
        {label:'Disq. Before Demo', val:pp.disqualifiedBeforeDemo, color:'#B8860B'},
        {label:'Not Qual. After Demo', val:pp.notQualAfterDemo, color:'#C0392B'},
        {label:'Too Early', val:pp.tooEarly, color:'#8a9aaa'},
      ].filter(r=>r.val>0).map(r => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <div style="font-size:11px;color:var(--mid-navy);width:148px;flex-shrink:0">${r.label}</div>
          <div style="flex:1;background:var(--card-bg);border-radius:3px;height:6px;overflow:hidden">
            <div style="height:100%;border-radius:3px;background:${r.color};width:${dqTotal>0?(r.val/dqTotal*100).toFixed(1):0}%"></div>
          </div>
          <div style="font-size:12px;font-weight:700;color:var(--deep-navy);width:28px;text-align:right">${r.val}</div>
          <div style="font-size:10px;color:#8a9aaa;width:34px">${dqTotal>0?(r.val/dqTotal*100).toFixed(0)+'%':''}</div>
        </div>`).join('')}
    </div>` : '';

  // MRR trend sparkline (last 3 windows as proxy bars)
  const mrrWindows = ['yesterday','rolling7','mtd'];
  const mrrTrendBars = mrrWindows.map(w => {
    const val = DATA.windows[w]?.newMRR || 0;
    return { val, label: w === 'yesterday' ? 'Yest' : w === 'rolling7' ? 'L7' : 'MTD' };
  });
  const mrrMax = Math.max(...mrrTrendBars.map(b=>b.val), 1);
  const mrrTrendHTML = mrrMax > 0 ? `
    <div style="margin-top:12px">
      <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(114,164,191,0.7);margin-bottom:6px">MRR Trend (Daily Avg)</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:40px">
        ${mrrTrendBars.map((b,i) => {
          const h = Math.max((b.val/mrrMax)*36, 3);
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
            <div style="font-size:8px;color:rgba(255,255,255,0.4)">${b.val>0?fmt$(Math.round(b.val/1000))+'k':''}</div>
            <div style="width:100%;height:${h.toFixed(0)}px;border-radius:3px 3px 0 0;background:${i===2?'rgba(114,164,191,0.7)':'rgba(114,164,191,0.3)'}"></div>
            <div style="font-size:8px;color:rgba(255,255,255,0.35)">${b.label}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  return `
    ${statHTML}

    <div class="sl">Website Funnel <span style="font-size:10px;color:#8a9aaa;font-weight:400;letter-spacing:0;text-transform:none">vs ${prevLabel}</span></div>
    ${wfFunnelHTML}

    <div class="sl">Key Performance Indicators <span style="font-size:10px;color:#8a9aaa;font-weight:400;letter-spacing:0;text-transform:none">vs ${prevLabel}</span></div>
    <div class="kpi-grid">${kpiHTML}</div>

    <div class="sl">Spend &amp; Cost Efficiency</div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Ad Spend by Channel</div>
        ${spendSummaryHTML}
        <div class="donut-wrap">${donutSVG}<div class="donut-legend">${legendHTML}</div></div>
        <div class="bar-chart">${barsHTML}</div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Cost Per Demo by Channel <span class="chart-title-meta">vs ${prevLabel}</span></div>
        <table class="cpd-table">
          <thead><tr><th>Channel</th><th>Spend</th><th>Ad Demos</th><th style="text-align:center">% of Booked</th><th>CPD</th><th>vs ${prevLabel}</th></tr></thead>
          <tbody>${cpdRows}</tbody>
          <tfoot><tr style="border-top:2px solid var(--card-border)">
            <td style="font-weight:700;font-size:12px">Total (all channels)</td>
            <td style="font-weight:700">${fmt$(sorted.reduce((s,c)=>s+c.spend,0))}</td>
            <td style="font-weight:700">${fmtN(sorted.reduce((s,c)=>s+c.demos,0))}</td>
            <td style="text-align:center;font-weight:700;font-size:11px;color:var(--soft-teal)">${d.demosBooked>0?Math.round(sorted.reduce((s,c)=>s+c.demos,0)/d.demosBooked*100)+'%':'—'}</td>
            <td colspan="2" style="font-size:11px;color:#8a9aaa;font-style:italic">${fmtN(d.demosBooked)} total booked</td>
          </tr></tfoot>
        </table>
      </div>
    </div>

    <div class="sl">Demo Pipeline</div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Conversion Funnel <span class="chart-title-meta">step-to-step CVR vs ${prevLabel}</span></div>
        <div class="funnel">${funnelHTML}</div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Pipeline Breakdown <span class="chart-title-meta">vs ${prevLabel}</span></div>
        <div class="pl-grid">${plHTML}</div>
        ${dqHTML}
      </div>
    </div>

    <div class="sl">Intelligence Report <span style="font-size:10px;color:#8a9aaa;font-weight:400;letter-spacing:0;text-transform:none">vs ${prevLabel}</span></div>
    <div style="margin-bottom:32px">${intelHTML}</div>
  `;
}

// ── Paid Media Analysis Panel ──────────────────────────────────
function buildPaidMediaPanel() {
  // Aggregate across all windows for a full picture — use MTD as primary, show all windows
  const windows = ['yesterday','rolling7','mtd'];
  const wLabels = { yesterday: 'Yesterday', rolling7: 'Last 7 Days', mtd: 'Month to Date' };
  const channels = ['meta','linkedin','google','tiktok','youtube'];

  // Use MTD as the primary window for the channel cards
  const mtd  = DATA.windows.mtd;
  const pmtd = DATA.windows.mtd.prev;
  const ch   = mtd.channels;
  const pch  = pmtd.channels;

  const totalSpend = channels.reduce((s,k) => s + (ch[k]?.spend||0), 0);
  const totalDemos = channels.reduce((s,k) => s + (ch[k]?.demos||0), 0);
  const drSpend    = (ch.meta?.spend||0) + (ch.google?.spend||0) + (ch.tiktok?.spend||0);
  const drDemos    = (ch.meta?.demos||0) + (ch.google?.demos||0) + (ch.tiktok?.demos||0);
  const pDrSpend   = (pch.meta?.spend||0) + (pch.google?.spend||0) + (pch.tiktok?.spend||0);
  const pDrDemos   = (pch.meta?.demos||0) + (pch.google?.demos||0) + (pch.tiktok?.demos||0);

  // Use the global deltaBadge() — same pill style as all other tabs
  const db = (curr, prev, invert=false) => deltaBadge(curr, prev, { invert });

  // Summary row (MTD)
  const pTotalSpend = channels.reduce((s,k)=>s+(pch[k]?.spend||0),0);
  const summaryHTML = `
    <div class="pm-summary-row">
      <div class="pm-summary-cell">
        <div class="psc-label">Total Spend (MTD)</div>
        <div class="psc-val">${fmt$(totalSpend)}</div>
        ${db(totalSpend, pTotalSpend, true)}
      </div>
      <div class="pm-summary-cell">
        <div class="psc-label">DR Spend (ex LI+YT)</div>
        <div class="psc-val">${fmt$(drSpend)}</div>
        ${db(drSpend, pDrSpend, true)}
      </div>
      <div class="pm-summary-cell">
        <div class="psc-label">Total Demos (ex LI+YT)</div>
        <div class="psc-val">${fmtN(drDemos)}</div>
        ${db(drDemos, pDrDemos)}
      </div>
      <div class="pm-summary-cell">
        <div class="psc-label">Blended CPD (ex LI+YT)</div>
        <div class="psc-val">${cpd$(drSpend, drDemos)}</div>
        ${db(cpdNum(drSpend,drDemos)||0, cpdNum(pDrSpend,pDrDemos)||0, true)}
      </div>
    </div>`;

  // Channel cards
  const chMeta = {
    meta:     { icon: '📘', name: 'Meta / Facebook' },
    linkedin: { icon: '💼', name: 'LinkedIn' },
    google:   { icon: '🔍', name: 'Google Ads' },
    tiktok:   { icon: '🎵', name: 'TikTok' },
    youtube:  { icon: '▶️',  name: 'YouTube' },
  };

  const cardsHTML = channels.map(k => {
    const c  = ch[k]  || { spend:0, demos:0, clicks:0, impressions:0, ctrAvg:null };
    const pc = pch[k] || { spend:0, demos:0, clicks:0, impressions:0, ctrAvg:null };
    const cpdV  = cpdNum(c.spend, c.demos);
    const pcpdV = cpdNum(pc.spend, pc.demos);
    const ctr   = c.ctrAvg  != null ? (c.ctrAvg * 100).toFixed(2)  + '%' : '—';
    const pctr  = pc.ctrAvg != null ? pc.ctrAvg : null;

    // Cross-window spend comparison bars
    const windowBarsHTML = windows.map(w => {
      const ws = DATA.windows[w]?.channels?.[k]?.spend || 0;
      const maxWS = Math.max(...windows.map(ww => DATA.windows[ww]?.channels?.[k]?.spend || 0), 1);
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div style="font-size:10px;color:#8a9aaa;width:64px;flex-shrink:0">${wLabels[w]}</div>
        <div style="flex:1;background:var(--card-bg);border-radius:4px;height:8px;overflow:hidden">
          <div style="height:100%;border-radius:4px;background:${CH_COLORS[k]};width:${(ws/maxWS*100).toFixed(1)}%;transition:width 0.8s ease"></div>
        </div>
        <div style="font-size:11px;font-weight:700;color:var(--deep-navy);width:54px;text-align:right;flex-shrink:0">${fmt$(ws)}</div>
      </div>`;
    }).join('');

    return `
      <div class="pm-card">
        <div class="pm-card-header">
          <span class="pm-card-icon">${chMeta[k].icon}</span>
          <span class="pm-card-name">${chMeta[k].name}</span>
        </div>
        <div class="pm-card-spend">${fmt$(c.spend)}<span style="font-size:12px;font-weight:400;color:#8a9aaa;margin-left:6px">MTD spend</span></div>
        <div class="pm-card-rows">
          <div class="pm-card-row">
            <span class="pm-card-row-label">Demos</span>
            <span class="pm-card-row-val">${fmtN(c.demos)} ${db(c.demos, pc.demos)}</span>
          </div>
          <div class="pm-card-row">
            <span class="pm-card-row-label">CPD</span>
            <span class="pm-card-row-val">${cpdV ? fmt$(cpdV) : '—'} ${cpdV&&pcpdV ? db(cpdV, pcpdV, true) : ''}</span>
          </div>
          <div class="pm-card-row">
            <span class="pm-card-row-label">CTR</span>
            <span class="pm-card-row-val">${ctr} ${c.ctrAvg&&pctr ? db(c.ctrAvg, pctr) : ''}</span>
          </div>
          <div class="pm-card-row">
            <span class="pm-card-row-label">Clicks</span>
            <span class="pm-card-row-val">${fmtN(c.clicks)} ${db(c.clicks, pc.clicks)}</span>
          </div>
          <div class="pm-card-row">
            <span class="pm-card-row-label">Impressions</span>
            <span class="pm-card-row-val">${fmtN(c.impressions)} ${db(c.impressions, pc.impressions)}</span>
          </div>
        </div>
        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--card-border)">
          <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--soft-teal);margin-bottom:8px">Spend by Window</div>
          ${windowBarsHTML}
        </div>
      </div>`;
  }).join('');

  // CPD comparison table — clean: one row per channel, CPD + spend per window, no stacking
  const cpdTableRows = channels.map(k => {
    return `<tr>
      <td style="font-weight:700">${CH_ICONS[k]} ${chMeta[k].name}</td>
      ${windows.map(w => {
        const c  = DATA.windows[w]?.channels?.[k];
        const pc = DATA.windows[w]?.prev?.channels?.[k];
        const v  = c  ? cpdNum(c.spend,  c.demos)  : null;
        const pv = pc ? cpdNum(pc.spend, pc.demos) : null;
        const spendV = c?.spend || 0;
        if (!v && !spendV) return `<td style="text-align:right;color:#c0c8d0;font-size:12px">—</td>`;
        const cpdStr = v ? `<span style="font-weight:700;font-size:13px;color:${v>500?'#C0392B':v>350?'#B8860B':'var(--deep-navy)'}">${fmt$(v)}</span>` : `<span style="color:#c0c8d0">—</span>`;
        const cpdDlt = (v !== null && pv !== null) ? `<span style="margin-left:4px">${db(v, pv, true)}</span>` : '';
        const spendStr = spendV > 0 ? `<div style="font-size:11px;color:#8a9aaa;margin-top:2px">${fmt$(spendV)}</div>` : '';
        return `<td style="text-align:right"><div style="display:inline-flex;flex-direction:column;align-items:flex-end">${cpdStr}${cpdDlt}${spendStr}</div></td>`;
      }).join('')}
    </tr>`;
  }).join('');

  // CPD trend line chart — all channels across all 3 windows
  const channelDataByWindow = {};
  windows.forEach(w => { channelDataByWindow[w] = DATA.windows[w]?.channels || {}; });
  const cpdLineHTML = buildCPDLineChart(channelDataByWindow, windows, wLabels);

  // Channel efficiency chart — horizontal bars per channel: CPD bar + demo count
  // Replace scatter (broke when Meta demos >> others) with a clear bar layout
  const effChannels = channels.filter(k => (ch[k]?.spend||0) > 0);
  const maxCPD  = Math.max(...effChannels.filter(k=>(ch[k]?.demos||0)>0).map(k=>ch[k].spend/ch[k].demos), 1);
  const maxDemos= Math.max(...effChannels.map(k=>ch[k]?.demos||0), 1);
  const chColors= {meta:'#4d8aaa',linkedin:'#1D4053',google:'#9bbfd4',tiktok:'#72A4BF',youtube:'#bfd0da'};

  const effRows = effChannels.map(k => {
    const c   = ch[k];
    const cpd = c.demos > 0 ? c.spend / c.demos : null;
    const cpdPct  = cpd  ? (cpd  / maxCPD)   * 100 : 0;
    const demoPct = maxDemos > 0 ? (c.demos / maxDemos) * 100 : 0;
    const cpdColor= cpd && cpd > 500 ? '#C0392B' : cpd && cpd > 350 ? '#B8860B' : chColors[k];
    return `
      <div style="display:grid;grid-template-columns:100px 1fr 60px 1fr 50px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--card-border)">
        <div style="font-size:12px;font-weight:700;color:var(--deep-navy);white-space:nowrap">${CH_ICONS[k]} ${CH_LABELS[k].split(' ')[0]}</div>
        <div style="position:relative;height:8px;background:rgba(212,230,239,0.4);border-radius:4px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;height:100%;width:${cpdPct.toFixed(1)}%;background:${cpdColor};border-radius:4px;transition:width 0.8s ease"></div>
        </div>
        <div style="font-size:12px;font-weight:700;color:${cpdColor};text-align:right">${cpd?fmt$(Math.round(cpd)):'—'}</div>
        <div style="position:relative;height:8px;background:rgba(212,230,239,0.4);border-radius:4px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;height:100%;width:${demoPct.toFixed(1)}%;background:${chColors[k]};border-radius:4px;opacity:0.6;transition:width 0.8s ease"></div>
        </div>
        <div style="font-size:12px;font-weight:700;color:var(--mid-navy);text-align:right">${fmtN(c.demos)}</div>
      </div>`;
  }).join('');

  const effHTML = effRows ? `
    <div style="display:grid;grid-template-columns:100px 1fr 60px 1fr 50px;gap:10px;padding-bottom:6px;margin-bottom:2px">
      <div></div>
      <div style="font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--soft-teal)">Cost per Demo</div>
      <div></div>
      <div style="font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--soft-teal)">Demo Volume</div>
      <div></div>
    </div>
    ${effRows}
    <div style="margin-top:12px;font-size:11px;color:#8a9aaa;font-style:italic">Lower CPD bar = more efficient. Longer demo bar = higher volume. MTD data.</div>` : '';

  const scatterSVG = effHTML;

  return `
    <div class="sl">Paid Media Summary <span style="font-size:10px;color:#8a9aaa;font-weight:400;letter-spacing:0;text-transform:none">Month to Date vs Prior Month</span></div>
    ${summaryHTML}

    <div class="sl">Channel Performance <span style="font-size:10px;color:#8a9aaa;font-weight:400;letter-spacing:0;text-transform:none">Month to Date — with prior month deltas</span></div>
    <div class="pm-grid">${cardsHTML}</div>

    <div class="sl">CPD Trend by Channel <span style="font-size:10px;color:#8a9aaa;font-weight:400;letter-spacing:0;text-transform:none">Yesterday → Last 7 Days → MTD</span></div>
    <div class="chart-card" style="margin-bottom:32px">
      <div class="chart-title">CPD Trend — All Channels</div>
      ${cpdLineHTML}
    </div>

    <div class="charts-row" style="margin-bottom:32px">
      <div class="chart-card">
        <div class="chart-title">CPD by Channel &amp; Window</div>
        <table class="cpd-table">
          <thead><tr><th>Channel</th>${windows.map(w=>`<th>${wLabels[w]}<br><span style="font-size:9px;color:#8a9aaa;font-weight:400;letter-spacing:0;text-transform:none">+/- vs prior</span></th>`).join('')}</tr></thead>
          <tbody>${cpdTableRows}</tbody>
        </table>
      </div>
      <div class="chart-card">
        <div class="chart-title">Channel Efficiency (MTD) <span class="chart-title-meta">CPD vs Demo Volume</span></div>
        ${scatterSVG}
      </div>
    </div>
  `;
}

// Init
document.getElementById('gen-time').textContent = DATA.generatedAt;
document.getElementById('footer-file').textContent = DATA.filename ? `Source: ${DATA.filename}` : '';
const WINDOW_KEYS = ['yesterday','rolling7','mtd'];

// Update tab button labels with date ranges from DATA
WINDOW_KEYS.forEach(key => {
  const btn = document.getElementById('tab-btn-' + key);
  if (btn && DATA.windows[key]?.label) btn.textContent = DATA.windows[key].label;
});

Object.entries(DATA.windows).forEach(([key,d]) => {
  const el = document.getElementById('panel-' + key);
  if (el && WINDOW_KEYS.includes(key)) el.innerHTML = buildPanel(key, d);
});
</script>
</body>
</html>
